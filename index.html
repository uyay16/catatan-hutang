<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My App</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1abc9c 0%, #16a085 100%);
            color: white;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        h1 { margin-bottom: 1rem; }
        button {
            background: #f39c12;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            margin: 10px;
        }
        .feature {
            background: rgba(255,255,255,0.15);
            padding: 1.5rem;
            border-radius: 10px;
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Your App</h1>
        <p>This content is now mobile-ready!</p>
        <div class="feature">
            <h3>✨ Feature Check</h3>
            <p>WebView supports complex CSS and JavaScript features.</p>
        </div>
        <button onclick="alert('Hello from the WebView! 👋')">Show Alert</button>
    </div>
</body>
</html>
